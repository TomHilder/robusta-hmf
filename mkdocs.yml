site_name: robusta-hmf
site_description: Robust heteroskedastic matrix factorisation in JAX
site_url: https://tomhilder.github.io/robusta-hmf/
repo_url: https://github.com/TomHilder/robusta-hmf
repo_name: TomHilder/robusta-hmf

theme:
  name: material
  palette:
    # Dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - API Reference:
    - api/robusta.md
    - api/sharded.md
    - api/metrics.md
    - api/diagnostics.md
    - api/customisation.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            heading_level: 2
            members_order: source
            docstring_style: numpy
